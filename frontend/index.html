<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" href="/frontend/brand.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="/frontend/theme.js?v=2"></script>
    <link rel="stylesheet" href="/frontend/style.css?v=27">

<body>

    <!-- Top Navigation -->
    <nav class="topnav">
        <div class="topnav-inner">
            <a href="#/dashboard" class="topnav-brand">
                <img class="topnav-logo" src="/frontend/brand.png" alt="OpenDCF logo">
                <span>OpenDCF</span>
            </a>
            <div class="topnav-links" id="topnavLinks">
                <a href="#/dashboard" class="topnav-link" data-section="properties">Properties</a>
                <a href="#/funds" class="topnav-link" data-section="portfolio">Portfolio</a>
                <a href="#/loans" class="topnav-link" data-section="lending">Lending</a>

                    <div class="menu-list menu-list--right">

                        <a href="#/help" class="menu-item">Help &amp; glossary</a>
                    </div>
                </div>
            </div>
            <div class="topnav-right">
                <button type="button" class="topnav-search" id="topnavSearch" aria-label="Search and commands">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <span>Search</span><kbd id="topnavSearchKey">⌘K</kbd>
                </button>
                <button type="button" class="topnav-icon-btn" id="helpChatToggle" aria-label="Modeling help" title="Modeling help" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".5" fill="currentColor"/></svg>

                <button type="button" class="topnav-icon-btn" id="themeToggle" aria-pressed="false">
                    <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <div class="api-status" id="apiStatus">
                    <div class="status-dot"></div>
                    <span>Connecting...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <nav class="subnav" id="subnav" hidden></nav>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content" id="app">
            <div class="loading-screen">
                <div class="loading-spinner"></div>
                <p>Loading...</p>
            </div>
        </div>
    </main>
